name: pikop_flutter
description: "Pikop Multi-Platform Logistics App"
version: 3.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Essentials
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.5
  dio: ^5.5.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  get_it: ^7.6.7
  equatable: ^2.0.5

  # UI & Media
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0

  # Logistics & Maps
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  google_places_flutter: ^2.0.2
  flutter_polyline_points: ^2.0.0

  # Features
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  socket_io_client: ^3.1.2
  webview_flutter: ^4.8.0
  paystack_manager: ^1.0.7
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
