# INCREASED MEMORY for R8 Release Build (v4.7 Polish)
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=false
# DISABLE Configuration Cache to resolve persistent service initialization errors
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# 16KB Compatibility & Stability (DISABLED to restore Maps compatibility)
android.bundle.enable16kAlignment=false
android.useNextgenZipAlign=false
android.disallowKotlinSourceSets=false
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
org.gradle.caching=true

# Launch & Install Optimization
android.injected.testOnly=false
android.debug.obsoleteApi=true
android.injected.checkAarMetadata=false

# Disabled parallel sync
org.gradle.tooling.parallel=false
