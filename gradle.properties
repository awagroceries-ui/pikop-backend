# BALANCED MEMORY for 7GB RAM machine - Prevents Metaspace OOM and IDE timeouts
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=384m
org.gradle.daemon=false
org.gradle.parallel=false
# DISABLE Configuration Cache to resolve persistent service initialization errors
org.gradle.configuration-cache=false
org.gradle.vfs.watch=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# 16KB Compatibility & Stability
android.bundle.enable16kAlignment=true
android.useNextgenZipAlign=true
android.disallowKotlinSourceSets=false
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
org.gradle.caching=true

# Launch & Install Optimization
android.injected.testOnly=false
android.debug.obsoleteApi=true
android.injected.checkAarMetadata=false

# Disabled parallel sync
org.gradle.tooling.parallel=false
